services:
  app:
    # Prebuilt image published to GHCR by .github/workflows/docker.yml
    image: ghcr.io/seradedstripes/shiptalkers-app:latest
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DB=ship_talkers
      - CLICKHOUSE_USER=ship_talkers
      - CLICKHOUSE_PASSWORD=ship_talkers
      - SQLITE_DB_PATH=/data/auth.db
    volumes:
      - auth-data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:26.4
    cpus: "1.5"
    mem_limit: 2g
    pull_policy: if_not_present
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=ship_talkers
      - CLICKHOUSE_USER=ship_talkers
      - CLICKHOUSE_PASSWORD=ship_talkers
    # Merge tuning lives in a config.d file so it survives on a single-file compose deploy.
    # Writes it, then hands back to the image entrypoint (which execs clickhouse-server).
    command:
      - sh
      - -c
      - |
        cat > /etc/clickhouse-server/config.d/merge-tuning.xml <<'EOF'
        <clickhouse>
          <background_pool_size>1</background_pool_size>
          <background_schedule_pool_size>4</background_schedule_pool_size>
        </clickhouse>
        EOF
        exec /entrypoint.sh
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  clickhouse-data:
  auth-data:
