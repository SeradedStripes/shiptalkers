services:
  app:
    # Prebuilt image published to GHCR by .github/workflows/docker.yml
    image: ghcr.io/seradedstripes/shiptalkers-app:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file: .env
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DB=ship_talkers
      - CLICKHOUSE_USER=ship_talkers
      - CLICKHOUSE_PASSWORD=ship_talkers
    volumes:
      - auth-data:/app/data
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/stats"]
      interval: 30s
      timeout: 5s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:26.4
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=ship_talkers
      - CLICKHOUSE_USER=ship_talkers
      - CLICKHOUSE_PASSWORD=ship_talkers
    # Optional: expose the HTTP port if you want to query it from the host.
    ports:
      - "8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  clickhouse-data:
  auth-data:
