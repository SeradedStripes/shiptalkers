[package]
name = "ship-talkers-scraper"
version = "0.1.0"
edition = "2024"

[dependencies]
ship-talkers-lib = { path = "../shiptalkers-lib" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
mimalloc = "0.1.52"
