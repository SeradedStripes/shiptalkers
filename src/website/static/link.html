<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Account - Ship Talkers</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="link">
    <div class="container">
        <h1>Link Accounts</h1>
        <p>Connect your Slack and Hackatime accounts to start tracking.</p>
        
        <div class="card">
            <h2>Slack</h2>
            <p class="status" id="slack-status">Not connected</p>
        </div>

        <div class="card">
            <h2>Hackatime</h2>
            <p class="status" id="hackatime-status">Not connected</p>
            <a href="/api/auth/hackatime" class="btn" style="margin-top: 1rem;">Connect Hackatime</a>
        </div>
    </div>
</body>
</html>
