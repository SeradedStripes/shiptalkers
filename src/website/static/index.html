<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ship Talkers</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        p { color: #888; line-height: 1.6; margin-bottom: 1.5rem; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; background: #7c3aed; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .btn:hover { background: #6d28d9; }
        .links { display: flex; gap: 1rem; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ship Talkers</h1>
        <p>Compare your Slack activity to your coding activity on Hackatime.</p>
        <div class="links">
            <a href="/link" class="btn">Link Account</a>
            <a href="/stats" class="btn">View Stats</a>
        </div>
    </div>
</body>
</html>
