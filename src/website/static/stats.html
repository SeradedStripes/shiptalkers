<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats - Ship Talkers</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="stats">
    <div class="container">
        <h1><span class="live"></span>Stats</h1>
        
        <div class="grid">
            <div class="stat">
                <h3>Total Messages</h3>
                <div class="value purple" id="total-messages">-</div>
            </div>
            <div class="stat">
                <h3>Active Users</h3>
                <div class="value purple" id="active-users">-</div>
            </div>
            <div class="stat">
                <h3>Total Channels</h3>
                <div class="value purple" id="total-channels">-</div>
            </div>
            <div class="stat">
                <h3>Channels with Messages</h3>
                <div class="value purple" id="channels-tracked">-</div>
            </div>
            <div class="stat">
                <h3>Coding Minutes</h3>
                <div class="value purple" id="coding-minutes">-</div>
            </div>
            <div class="stat">
                <h3>Database Size</h3>
                <div class="value purple" id="db-size">-</div>
            </div>
        </div>

        <div class="tables-grid">
            <div class="table-card">
                <h2>Top Chatters</h2>
                <table>
                    <thead>
                        <tr><th>User</th><th>Messages</th></tr>
                    </thead>
                    <tbody id="top-chatters">
                        <tr><td colspan="2" class="empty">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="table-card">
                <h2>Top Shiptalker</h2>
                <table>
                    <thead>
                        <tr><th>User</th><th>Messages</th><th>Coding Time</th></tr>
                    </thead>
                    <tbody id="top-shiptalkers">
                        <tr><td colspan="3" class="empty">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchStats() {
            try {
                const resp = await fetch('/api/stats');
                const data = await resp.json();
                
                document.getElementById('total-messages').textContent = data.total_messages.toLocaleString();
                document.getElementById('active-users').textContent = data.active_users.toLocaleString();
                document.getElementById('total-channels').textContent = data.total_channels.toLocaleString();
                document.getElementById('channels-tracked').textContent = data.channels_tracked.toLocaleString();
                document.getElementById('coding-minutes').textContent = data.coding_minutes.toLocaleString();
                const gib = data.db_size_gib;
                document.getElementById('db-size').textContent = gib.toFixed(gib < 1 ? 5 : 2) + ' GiB';

                renderUserTable('top-chatters', data.leaderboard, true, false);
                renderUserTable('top-shiptalkers', data.shiptalkers, true, true);
            } catch (e) {
                console.error('Failed to fetch stats:', e);
            }
        }

        function renderUserTable(id, rows, showMessages, showMinutes) {
            const tbody = document.getElementById(id);
            const colspan = 1 + (showMessages ? 1 : 0) + (showMinutes ? 1 : 0);
            if (!rows || rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${colspan}" class="empty">Coming soon</td></tr>`;
                return;
            }
            tbody.innerHTML = rows.map(u => {
                let cells = `<td>${u.user_id}</td>`;
                if (showMessages) cells += `<td>${u.messages.toLocaleString()}</td>`;
                if (showMinutes) cells += `<td>${u.coding_minutes.toLocaleString()} min</td>`;
                return `<tr>${cells}</tr>`;
            }).join('');
        }
        
        fetchStats();
        setInterval(fetchStats, 10000);
    </script>
</body>
</html>
