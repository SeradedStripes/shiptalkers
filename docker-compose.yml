services:
  app:
    build:
      context: .
      dockerfile: shiptalkers-app/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
    env_file: ./shiptalkers-app/.env
    environment:
      - DATABASE_URL=postgres://ship_talkers:ship_talkers@postgres:5432/ship_talkers
    depends_on:
      postgres:
        condition: service_healthy

  scraper:
    build:
      context: .
      dockerfile: shiptalkers-scraper/Dockerfile
      target: dev
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
    env_file: ./shiptalkers-scraper/.env
    environment:
      - DATABASE_URL=postgres://ship_talkers:ship_talkers@postgres:5432/ship_talkers
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=ship_talkers
      - POSTGRES_USER=ship_talkers
      - POSTGRES_PASSWORD=ship_talkers
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ship_talkers -d ship_talkers"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cargo-cache:
  postgres-data:
