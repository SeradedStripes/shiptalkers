name: PR workflow

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_call:

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"