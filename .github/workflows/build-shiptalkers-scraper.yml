name: Build shiptalkers-scraper

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - "shiptalkers-scraper/**"
      - "shiptalkers-lib/**"
      - ".github/actions/build-push-docker/**"
      - ".github/workflows/build-shiptalkers-scraper.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-shiptalkers-scraper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build and push image
        uses: ./.github/actions/build-push-docker
        with:
          context: .
          dockerfile: ./shiptalkers-scraper/Dockerfile
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          image: seradedstripes/shiptalkers-scraper
          cache_scope: shiptalkers-scraper

      - name: Deploy to Coolify
        uses: SeradedStripes/coolify-deploy@v1.1
        with:
          coolify_url: 'https://coolify.kirze.de'
          coolify_app_uuid: 'nhtvnfcv6l8ewtqu5qune9pi&'
          coolify_token: ${{ secrets.COOLIFY_TOKEN }}
          build_image: 'false'
