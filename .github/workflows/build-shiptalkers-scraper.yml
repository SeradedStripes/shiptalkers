name: Build shiptalkers-scraper

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - "shiptalkers-scraper/**"
      - "shiptalkers-lib/**"
      - ".github/workflows/build-shiptalkers-scraper.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-shiptalkers-scraper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./shiptalkers-scraper/Dockerfile
          push: true
          tags: ghcr.io/seradedstripes/shiptalkers-scraper:latest
          cache-from: type=gha,scope=shiptalkers-scraper
          cache-to: type=gha,mode=max,scope=shiptalkers-scraper

      - name: Deploy to Coolify
        uses: SeradedStripes/coolify-deploy@v1.1
        with:
          coolify_url: 'https://coolify.kirze.de'
          coolify_app_uuid: 'nhtvnfcv6l8ewtqu5qune9pi&'
          coolify_token: ${{ secrets.COOLIFY_TOKEN }}
          build_image: 'false'
