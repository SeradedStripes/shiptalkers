name: Build shiptalkers-app

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - "shiptalkers-app/**"
      - "shiptalkers-lib/**"
      - ".github/workflows/build-shiptalkers-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-shiptalkers-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./shiptalkers-app/Dockerfile
          push: true
          tags: ghcr.io/seradedstripes/shiptalkers-app:latest
          cache-from: type=gha,scope=shiptalkers-app
          cache-to: type=gha,mode=max,scope=shiptalkers-app
          provenance: false
          sbom: false

      - name: Deploy to Coolify
        uses: SeradedStripes/coolify-deploy@v1.1
        with:
          coolify_url: 'https://coolify.kirze.de'
          coolify_app_uuid: 's352e8bj5qvtd4aiyzu6i08r'
          coolify_token: ${{ secrets.COOLIFY_TOKEN }}
          build_image: 'false'
