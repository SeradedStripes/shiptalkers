name: Build shiptalkers-app

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - "shiptalkers-app/**"
      - "shiptalkers-lib/**"
      - ".github/actions/build-push-docker/**"
      - ".github/workflows/build-shiptalkers-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-shiptalkers-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build and push image
        uses: ./.github/actions/build-push-docker
        with:
          context: .
          file: ./shiptalkers-app/Dockerfile
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          image: seradedstripes/shiptalkers-app
          cache_scope: shiptalkers-app

      - name: Deploy to Coolify
        uses: SeradedStripes/coolify-deploy@v1.1
        with:
          coolify_url: 'https://coolify.kirze.de'
          coolify_app_uuid: 's352e8bj5qvtd4aiyzu6i08r'
          coolify_token: ${{ secrets.COOLIFY_TOKEN }}
          build_image: 'false'
