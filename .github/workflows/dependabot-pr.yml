name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Wait for CI to pass
        run: |
          until gh pr checks "$PR_URL" --json name,state \
            --jq '[.[] | select(.name != "auto-merge")] as $c |
              ($c | length) > 0 and
              ($c | all(.state | ascii_downcase | IN("pending", "in_progress", "queued", "waiting") | not))' \
            | grep -qx true; do
            sleep 30
          done
          gh pr checks "$PR_URL" --json name,state \
            --jq '[.[] | select(.name != "auto-merge")] |
              (length) > 0 and all(.state | ascii_downcase == "success")' \
            | grep -qx true
        timeout-minutes: 60
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}