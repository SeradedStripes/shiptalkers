[package]
name = "ship-talkers"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
reqwest = { version = "0.13", features = ["json", "form", "query", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
clickhouse = { version = "0.15", features = ["time"] }
time = "0.3"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
askama = "0.16"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
resvg = { version = "0.48", default-features = false, features = ["text"] }
usvg = { version = "0.48", default-features = false, features = ["text"] }
mimalloc = "0.1"
ttf-parser = "0.25"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
