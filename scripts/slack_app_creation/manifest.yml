display_information:
  name: shiptalkers-scraper
features:
  bot_user:
    display_name: shiptalkers-scraper
    always_online: false
oauth_config:
  scopes:
    user:
      - channels:read
      - channels:history
    bot:
      - files:read
      - app_mentions:read
      - channels:history
      - channels:join
      - channels:read
      - chat:write
      - groups:history
      - groups:read
      - mpim:history
      - users:read
      - files:write
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - channel_created
      - channel_history_changed
      - message.channels
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false