services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
    env_file: .env
    environment:
      - CLICKHOUSE_DB=ship_talkers
      - CLICKHOUSE_USER=ship_talkers
      - CLICKHOUSE_PASSWORD=ship_talkers
      - CLICKHOUSE_URL=http://clickhouse:8123
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:26.4
    environment:
      - CLICKHOUSE_DB=ship_talkers
      - CLICKHOUSE_USER=ship_talkers
      - CLICKHOUSE_PASSWORD=ship_talkers
    ports:
      - "8123:8123"
      - "9000:9000"
    # Merge tuning lives in a config.d file so it survives on a single-file compose deploy.
    # Writes it, then hands back to the image entrypoint (which execs clickhouse-server).
    command:
      - sh
      - -c
      - |
        cat > /etc/clickhouse-server/config.d/merge-tuning.xml <<'EOF'
        <clickhouse>
          <background_pool_size>1</background_pool_size>
          <background_schedule_pool_size>4</background_schedule_pool_size>
        </clickhouse>
        EOF
        exec /entrypoint.sh
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cargo-cache:
  clickhouse-data:
