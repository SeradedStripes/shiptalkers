services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
    env_file: .env
    environment:
      - CLICKHOUSE_DB=ship_talkers
      - CLICKHOUSE_USER=ship_talkers
      - CLICKHOUSE_PASSWORD=ship_talkers
      - CLICKHOUSE_URL=http://clickhouse:8123
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.1.1315-amd64compat
    environment:
      - CLICKHOUSE_DB=ship_talkers
      - CLICKHOUSE_USER=ship_talkers
      - CLICKHOUSE_PASSWORD=ship_talkers
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cargo-cache:
  clickhouse-data:
